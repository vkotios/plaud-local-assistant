name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install application and provider test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev --extra cloud
      - name: Install CPU tensor test dependency
        run: uv pip install "torch>=2.8" --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: uv run --no-sync ruff check src tests
      # Full suite (upstream parity). Focused IGM/gateway smoke while iterating:
      #   uv run pytest -q tests/test_ai_gateway.py tests/test_config.py
      # Extras guidance (AMD/CPU, no CUDA assumption): docs/extras-matrix.md
      - name: Test
        run: uv run --no-sync pytest -q

  # Phase 6 packaging: validate Compose core profile + optional bridge compile.
  # Bridge compile evidence ≠ Note Pro transfer evidence (docs/ble-host.md).
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose core profile
        run: |
          docker compose --profile core config >/tmp/localplaud-core.yml
          grep -q 'LOCALPLAUD_RUNTIME: docker' /tmp/localplaud-core.yml
          grep -q 'localplaud-cpu' /tmp/localplaud-core.yml
      - name: Prepare minimal env for smoke
        run: |
          cp .env.example .env
          cp config.example.toml config.toml
          # Loopback DOMAIN avoids ACME; smoke hits the published app port.
          sed -i 's/^DOMAIN=.*/DOMAIN=localhost/' .env
          sed -i 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/' .env
      - name: Compose up core (build + health)
        run: |
          docker compose --profile core up -d --build localplaud-cpu
          # Wait for /healthz on the host-published port
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8081/healthz >/dev/null; then
              echo "healthy after ${i} attempts"
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              docker compose --profile core logs localplaud-cpu || true
              exit 1
            fi
          done
          ./scripts/deploy/smoke-test.sh http://127.0.0.1:8081
      - name: Doctor refuses BLE inside the core container
        run: |
          out="$(docker compose --profile core exec -T \
            -e LOCALPLAUD_BLE__ENABLED=true \
            localplaud-cpu localplaud doctor)"
          echo "$out"
          echo "$out" | grep -qi 'ble packaging'
          echo "$out" | grep -qiE 'unsupported|not supported'
      - name: Tear down
        if: always()
        run: docker compose --profile core down -v || true

  plaud-bridge-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build plaud-bridge when vendored (else skip)
        run: |
          # When Phase 4 has not merged the crate, this exits 0 with "skipped".
          # When the crate is present, install rustup and compile (≠ transfer proof).
          if [ -f vendor/openplod-ble/plaud-bridge/Cargo.toml ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
          fi
          ./scripts/packaging/build-plaud-bridge.sh
